[workspace]
resolver = "3"
members = ["crates/audio", "crates/display", "crates/engine", "crates/player"]

[workspace.package]
edition = "2024"
version = "0.1.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3

# The render loop has to hit every vsync even in debug builds.
[profile.dev]
opt-level = 1
