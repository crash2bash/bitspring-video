[package]
name = "bitspring-video"
description = "BitSpring Video: a player built around getting HDR right"
edition.workspace = true
version.workspace = true

[dependencies]
bsv-audio = { path = "../audio" }
bsv-display = { path = "../display" }
bsv-engine = { path = "../engine" }
winit = "0.30"
raw-window-handle = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
raw-window-metal = "1"
objc2 = "0.6"
