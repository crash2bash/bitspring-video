[package]
name = "bsv-winhost"
description = "The player as a Windows library with a C interface, for the WinUI application to load"
edition.workspace = true
version.workspace = true

[lib]
name = "bitspring_video_core"
crate-type = ["cdylib"]

# Nothing here is built for other systems: the crate is empty there.
[target.'cfg(windows)'.dependencies]
bitspring-video = { path = "../player" }
bsv-display = { path = "../display" }
bsv-engine = { path = "../engine" }
serde_json = "1"
